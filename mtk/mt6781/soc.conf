# mtk/mt6781/soc.conf: the MediaTek MT6781 (Helio G96), whatever phone it is in. A phone with this SoC says `soc mt6781` in its
# device.conf and includes configs/mt6781.config from its defconfig. Started from mtk/mt6768/.

soc mt6781
	title       MediaTek MT6781 (Helio G96; "mt6781" in the device tree)
	vendor      MediaTek
	cores       8: six Cortex-A55 (cores 0-5) and two Cortex-A76 (cores 6 and 7; the device tree says A75)
	gpu         Mali-G57 MC2
	maintainer  DrtSinX98
